<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UPI Conversational Insights</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>UPI Conversational Insights</h1>
      <p>Ask business questions in natural language. Answers come from your CSV with charts and tables.</p>
    </header>
    <main id="chat"></main>
    <section class="quick">
      <button class="q">Which transaction type has the highest failure rate?</button>
      <button class="q">How do failure rates compare between Android and iOS users?</button>
      <button class="q">What are peak transaction hours for Grocery on weekends?</button>
      <button class="q">Which age group uses P2P transfers most frequently?</button>
      <button class="q">What percentage of high-value transactions are flagged for review?</button>
    </section>
    <form id="askForm">
      <input id="question" placeholder="Ask a question..." autocomplete="off" />
      <button type="submit">Ask</button>
    </form>
  </div>
  <script src="/app.js"></script>
</body>
</html>
